; PlatformIO Project Configuration — VolatiSafe AIoT Field Node
; Board  : ESP32 NodeMCU V1 (30-pin)
; Domain : Hardware & Edge Firmware (Hafiiz)
; Spec   : docs/hardware/FIRMWARE_SPEC.md, docs/hardware/PINOUT_AND_SCHEMATICS.md

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

; Build fisik: ESP32 + SX1278 LoRa 433 MHz
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D TRANSPORT_KIND=1

build_src_filter =
    +<*>
    -<transport_mqtt.cpp>

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    sandeepmistry/LoRa@^0.8.0
    bblanchon/ArduinoJson@^7.0.4

; Build simulasi Wokwi: ESP32 + WiFi -> Mosquitto.
; Wokwi tidak punya part SX1278, jadi hanya modul transport yang berbeda;
; sensors.cpp dan payload.cpp tetap identik byte-per-byte (HW-5.3).
[env:wokwi]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D TRANSPORT_KIND=2
    -D SIM_NODE=1
    -D SIM_FAST_CYCLE=1
    -D SIM_WIFI_SSID=\"Wokwi-GUEST\"
    -D SIM_WIFI_PASS=\"\"
    -D SIM_MQTT_HOST=\"host.wokwi.internal\"
    -D SIM_MQTT_PORT=1883
    ; Mode probe sementara (DEC-IOT-17). Hanya sampling + cetak Serial, tanpa
    ; TX dan tanpa sleep. Wajib dihapus saat HW-4.3 orkestrasi penuh masuk.
    -D SENSOR_PROBE=1
    ; Selftest NVS sekali di boot. Wokwi CLI memakai flash bersih tiap run,
    ; jadi DoD "nilai bertahan setelah reboot" hanya bisa dibuktikan sebagai
    ; round-trip tulis-baca di dalam satu boot.
    -D CAL_NVS_SELFTEST=1

build_src_filter =
    +<*>
    -<transport_lora.cpp>

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

; Unit test logika murni di PC, tanpa board (HW-3.5).
; Hanya payload.cpp, sensors_core.cpp, dan calibration_core.cpp yang masuk:
; ketiganya tidak menyentuh Arduino.h, jadi tidak butuh board maupun toolchain
; Xtensa.
[env:native]
platform = native
test_framework = unity
; Tanpa ini PlatformIO tidak mengompilasi src/ saat test, dan semua simbol
; di bawah jadi undefined reference saat link.
test_build_src = true
build_flags =
    -D NATIVE_BUILD=1
    -D TRANSPORT_KIND=0
    -D UNITY_INCLUDE_DOUBLE
build_src_filter =
    +<payload.cpp>
    +<sensors_core.cpp>
    +<calibration_core.cpp>
    +<transport_core.cpp>
