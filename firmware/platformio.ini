; PlatformIO Project Configuration File for VolatiSafe-AIoT ESP32 Node
; Board: ESP32 NodeMCU V1 (30-pin)
; Framework: Arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    sandeepmistry/LoRa @ ^0.8.0
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D LORA_FREQUENCY=433E6
    -D LORA_SPREADING_FACTOR=7
    -D LORA_BANDWIDTH=125E3
    -D LORA_CODING_RATE=5
    -D LORA_TX_POWER=17
