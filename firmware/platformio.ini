; PlatformIO Project Configuration — VolatiSafe AIoT Field Node
; Board  : ESP32-WROOM-32D
; Domain : Hardware & Edge Firmware (Hafiiz)
; Spec   : docs/hardware/FIRMWARE_SPEC.md, docs/hardware/PINOUT_AND_SCHEMATICS.md

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

; Build fisik node saat ini: ESP32-WROOM-32D + WiFi/MQTT + micro SD.
; LoRa belum terpasang, jadi env ini memakai MQTT. Isi WIFI_SSID/WIFI_PASS/
; MQTT_HOST sesuai jaringan Anda sebelum flash, atau override lewat
; --build-flag seperti contoh di docs/hardware/WOKWI_SIMULATION.md.
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D TRANSPORT_KIND=2
    -D PH_ONBOARD=0
    -D WIFI_SSID=\"ESP32D\"
    -D WIFI_PASS=\"indonesia\"
    -D MQTT_HOST=\"192.168.1.10\"
    -D MQTT_PORT=1883

build_src_filter =
    +<*>
    -<transport_lora.cpp>

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

; Build fisik dengan LoRa SX1278 (belum terpasang di node ini). Pindahkan
; PIN_LORA_CS dari GPIO5 sebelum dipakai karena bentrok dengan CS SD.
[env:esp32dev_lora]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D TRANSPORT_KIND=1
    -D PH_ONBOARD=0

build_src_filter =
    +<*>
    -<transport_mqtt.cpp>

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    sandeepmistry/LoRa@^0.8.0
    bblanchon/ArduinoJson@^7.0.4

; Build simulasi Wokwi: ESP32 + WiFi -> Mosquitto.
; Wokwi tidak punya part SX1278, jadi hanya modul transport yang berbeda;
; sensors.cpp dan payload.cpp tetap identik byte-per-byte (HW-5.3).
[env:wokwi]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D TRANSPORT_KIND=2
    -D SIM_NODE=1
    -D SIM_FAST_CYCLE=1
    -D SIM_WIFI_SSID=\"Wokwi-GUEST\"
    -D SIM_WIFI_PASS=\"\"
    -D SIM_MQTT_HOST=\"host.wokwi.internal\"
    -D SIM_MQTT_PORT=1883

build_src_filter =
    +<*>
    -<transport_lora.cpp>

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

; Unit test logika murni di PC, tanpa board (HW-3.5).
; Hanya payload.cpp, sensors_core.cpp, dan calibration_core.cpp yang masuk:
; ketiganya tidak menyentuh Arduino.h, jadi tidak butuh board maupun toolchain
; Xtensa.
[env:native]
platform = native
test_framework = unity
; Tanpa ini PlatformIO tidak mengompilasi src/ saat test, dan semua simbol
; di bawah jadi undefined reference saat link.
test_build_src = true
build_flags =
    -D NATIVE_BUILD=1
    -D TRANSPORT_KIND=0
    -D UNITY_INCLUDE_DOUBLE
build_src_filter =
    +<payload.cpp>
    +<sensors_core.cpp>
    +<calibration_core.cpp>
    +<transport_core.cpp>

; Varian test untuk node tanpa modul pH: memastikan placeholder dan status
; SENSOR_NOT_PRESENT benar-benar dipakai, bukan noise GPIO32.
[env:native_no_ph]
extends = env:native
build_flags = ${env:native.build_flags} -D PH_ONBOARD=0
