; PlatformIO Project Configuration — VolatiSafe AIoT Field Node
; Board  : ESP32 NodeMCU V1 (30-pin)
; Domain : Hardware & Edge Firmware (Hafiiz)
; Spec   : docs/hardware/FIRMWARE_SPEC.md, docs/hardware/PINOUT_AND_SCHEMATICS.md

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    sandeepmistry/LoRa@^0.8.0
    bblanchon/ArduinoJson@^7.0.4
