name: 'Skenario Fault Range — sensor short & putus'
version: 1
author: 'VolatiSafe AIoT — Hafiiz'

# HW-3.1: membuktikan nilai di luar kontrak TIDAK dipotong ke 0/100. Sebelum
# clamp dibuang, sensor short tampil "m=100.0%(OK)" dan sensor putus tampil
# "m=0.0%(OK)"; keduanya lolos gate backend sebagai data tanah sungguhan.
# position = ADC / 4095, jadi 0.0 -> ADC 0 (short) dan 1.0 -> ADC 4095 (putus).

steps:
  - set-control:
      part-id: pot_moist
      name: position
      value: 0.0
  - set-control:
      part-id: pot_ph
      name: position
      value: 0.310378
  - set-control:
      part-id: pot_batt
      name: position
      value: 0.586325
  - set-control:
      part-id: ds18b20
      name: temperature
      value: 34.5

  # ADC 0 -> (2800-0)/1450*100 = 193,1 %. pH ikut terkompensasi moisture yang
  # dibatasi ke 100 %, jadi 7,61 bukan 7,85.
  - delay: 2s
  - wait-serial: '[SENS] m=193.1%(RANGE) ph=7.61(OK) t=34.50C(OK) b=3.87V(OK)'

  # ADC 4095 -> (2800-4095)/1450*100 = -89,3 %.
  - set-control:
      part-id: pot_moist
      name: position
      value: 1.0
  - delay: 2s
  - wait-serial: '[SENS] m=-89.3%(RANGE) ph=7.91(OK) t=34.50C(OK) b=3.87V(OK)'

  # Divider baterai putus -> 0,00 V, bukan "baterai habis".
  - set-control:
      part-id: pot_batt
      name: position
      value: 0.0
  - delay: 2s
  - wait-serial: '[SENS] m=-89.3%(RANGE) ph=7.91(OK) t=34.50C(OK) b=0.00V(RANGE)'
