name: 'Siklus penuh - sampling, TX, tidur, bangun'
version: 1
author: 'VolatiSafe AIoT - Hafiiz'

# Bukti HW-4.2/HW-4.3: satu siklus utuh berakhir di tidur simulasi, lalu
# bangun lagi. Bukti HW-4.1 terlihat dari urutan sensor ON -> OFF -> TX.
# Wokwi memakai restart setelah 10 detik (DEC-IOT-20), bukan DEEPSLEEP_RESET.

steps:
  - set-control:
      part-id: pot_moist
      name: position
      value: 0.609523
  - set-control:
      part-id: pot_ph
      name: position
      value: 0.310378
  - set-control:
      part-id: ds18b20
      name: temperature
      value: 34.5

  - wait-serial: '[PWR] sensor ON'
  - wait-serial: '[PWR] sensor OFF'
  - wait-serial: '[PWR] sampling'
  - wait-serial: '[PWR] tidur 10 detik'
  - wait-serial: '[PWR] wake: reset (SIM sleep)'
  - wait-serial: '[PWR] sensor ON'
